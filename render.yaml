services:
  - type: web
    name: spk-pkl-sarastya
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: spk-sarastya-db
          property: connectionString

databases:
  - name: spk-sarastya-db
    databaseName: spk_sarastya
    user: spk_sarastya_user
    plan: free
    region: singapore
